[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meddatahub-backend"
version = "0.1.0"
description = "MedDataHub API for an AI-ready medical dataset repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36,<2.1",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16.0",
  "pytest>=8.3.4",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
