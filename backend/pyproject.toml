[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meddatahub-backend"
version = "0.2.0"
description = "MedDataHub API for an AI-ready medical dataset repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "numpy>=2.0,<2.5",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3,<3.1",
  "pymysql>=1.1.1",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.10.1",
  "python-dateutil>=2.9.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16.0",
  "pytest>=8.3.4",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
